<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ULTRA ENGINE Pro</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
.glass {
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}
</style>
</head>

<body class="bg-slate-100 dark:bg-slate-900 text-slate-900 dark:text-slate-100">

<div class="max-w-md mx-auto p-4 space-y-4">

<!-- Header -->
<div class="flex justify-between items-center">
    <div class="text-xl font-black text-blue-600">ULTRA ENGINE Pro</div>
    <button onclick="toggleDarkMode()" class="text-xs px-3 py-1 bg-slate-800 text-white rounded-full">
        MODE
    </button>
</div>

<!-- Stats -->
<div id="stats" class="hidden text-center text-xs font-bold text-blue-500"></div>

<!-- Settings -->
<div class="glass p-4 rounded-2xl space-y-4">

    <!-- Start Word -->
    <div>
        <div class="text-xs font-bold mb-1">開始単語</div>
        <input id="sw" class="w-full p-2 rounded-xl bg-slate-200 dark:bg-slate-800" />
    </div>

    <!-- Start Char -->
    <div>
        <div class="text-xs font-bold mb-1">開始文字</div>
        <input id="sc" class="w-full p-2 rounded-xl bg-slate-200 dark:bg-slate-800" />
    </div>

    <!-- Must Char -->
    <div>
        <div class="text-xs font-bold mb-1">必須文字（例: ア:2, イ=1）</div>
        <input id="must_char" class="w-full p-2 rounded-xl bg-slate-200 dark:bg-slate-800" />
    </div>

    <!-- End Char -->
    <div>
        <div class="text-xs font-bold mb-1">終了文字</div>
        <input id="ec" class="w-full p-2 rounded-xl bg-slate-200 dark:bg-slate-800" />
    </div>

    <!-- End Word -->
    <div>
        <div class="text-xs font-bold mb-1">終了単語</div>
        <input id="ew" class="w-full p-2 rounded-xl bg-slate-200 dark:bg-slate-800" />
    </div>

    <!-- All Start Char -->
    <div>
        <div class="text-xs font-bold mb-1">全単語の開始文字</div>
        <input id="asc" class="w-full p-2 rounded-xl bg-slate-200 dark:bg-slate-800" />
    </div>

    <!-- All End Char -->
    <div>
        <div class="text-xs font-bold mb-1">全単語の終了文字</div>
        <input id="aec" class="w-full p-2 rounded-xl bg-slate-200 dark:bg-slate-800" />
    </div>

    <!-- Valid Chars -->
    <div>
        <div class="text-xs font-bold mb-1">使用可能文字</div>
        <input id="valid_chars" class="w-full p-2 rounded-xl bg-slate-200 dark:bg-slate-800" />
    </div>

    <!-- Exclude Chars -->
    <div>
        <div class="text-xs font-bold mb-1">禁止文字</div>
        <input id="exclude_chars" class="w-full p-2 rounded-xl bg-slate-200 dark:bg-slate-800" />
    </div>

    <!-- Ban Start Chars -->
    <div>
        <div class="text-xs font-bold mb-1">禁止開始文字</div>
        <input id="ban_start_chars" class="w-full p-2 rounded-xl bg-slate-200 dark:bg-slate-800" />
    </div>

    <!-- Target Total Length -->
    <div>
        <div class="text-xs font-bold mb-1">総文字数（任意）</div>
        <input id="ttl" type="number" class="w-full p-2 rounded-xl bg-slate-200 dark:bg-slate-800" />
    </div>

    <!-- Length Mode -->
    <div>
        <div class="text-xs font-bold mb-1">文字数モード</div>
        <select id="len_mode" class="w-full p-2 rounded-xl bg-slate-200 dark:bg-slate-800">
            <option value="free">自由</option>
            <option value="strict">厳密</option>
        </select>
    </div>

    <!-- Sort Mode -->
    <div>
        <div class="text-xs font-bold mb-1">ソート</div>
        <select id="sort_mode" class="w-full p-2 rounded-xl bg-slate-200 dark:bg-slate-800">
            <option value="kana">五十音順</option>
            <option value="len_asc">短い順</option>
            <option value="len_desc">長い順</option>
            <option value="random">ランダム</option>
        </select>
    </div>

    <!-- Shift -->
    <div class="space-y-2">
        <div class="flex items-center gap-2">
            <input id="use_shift" type="checkbox" />
            <div class="text-xs font-bold">50音ずらし</div>
        </div>

        <div class="flex gap-2">
            <div class="flex-1">
                <div class="text-xs font-bold mb-1">ずらし量</div>
                <input id="ks_abs" type="number" value="1" class="w-full p-2 rounded-xl bg-slate-200 dark:bg-slate-800" />
            </div>
            <div class="flex-1">
                <div class="text-xs font-bold mb-1">モード</div>
                <select id="shift_mode" class="w-full p-2 rounded-xl bg-slate-200 dark:bg-slate-800">
                    <option value="abs">±</option>
                    <option value="rel">+のみ</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Physical Shift -->
    <div>
        <div class="text-xs font-bold mb-1">物理ずらし</div>
        <input id="pos_shift" type="number" value="0" class="w-full p-2 rounded-xl bg-slate-200 dark:bg-slate-800" />
    </div>

    <!-- Kana Options -->
    <div class="space-y-1">
        <label class="flex items-center gap-2 text-xs">
            <input id="unify_small" type="checkbox" /> 小文字統一
        </label>
        <label class="flex items-center gap-2 text-xs">
            <input id="allow_daku" type="checkbox" /> 濁点許可
        </label>
        <label class="flex items-center gap-2 text-xs">
            <input id="allow_handaku" type="checkbox" /> 半濁点許可
        </label>
    </div>

    <!-- Recovery / Round Trip -->
    <div class="space-y-1">
        <label class="flex items-center gap-2 text-xs">
            <input id="auto_recovery" type="checkbox" /> 遡り接続
        </label>
        <label class="flex items-center gap-2 text-xs">
            <input id="round_trip" type="checkbox" /> 牛耕（往復）
        </label>
    </div>

    <!-- Char Limit Mode -->
    <div>
        <label class="flex items-center gap-2 text-xs">
            <input id="char_limit_mode" type="checkbox" /> 文字重複禁止
        </label>
    </div>

    <!-- Conjugate -->
    <div>
        <label class="flex items-center gap-2 text-xs">
            <input id="exclude_conjugate" type="checkbox" /> 共役排除
        </label>
    </div>

    <!-- Anti Loop -->
    <div>
        <label class="flex items-center gap-2 text-xs">
            <input id="anti_loop" type="checkbox" /> 1文字ループ拒否
        </label>
    </div>

    <!-- Timeout -->
    <div class="space-y-1">
        <label class="flex items-center gap-2 text-xs">
            <input id="timeout_enabled" type="checkbox" checked /> タイムアウト
        </label>
        <input id="timeout" type="number" value="15" class="w-full p-2 rounded-xl bg-slate-200 dark:bg-slate-800" />
    </div>

    <!-- Limit -->
    <div class="space-y-1">
        <label class="flex items-center gap-2 text-xs">
            <input id="limit_enabled" type="checkbox" checked /> 最大件数
        </label>
        <input id="limit" type="number" value="1500" class="w-full p-2 rounded-xl bg-slate-200 dark:bg-slate-800" />
    </div>

    <!-- Display Mode -->
    <div>
        <label class="flex items-center gap-2 text-xs">
            <input id="early_cut" type="checkbox" /> 早期表示
        </label>
    </div>

    <!-- Realtime Counter -->
    <div>
        <label class="flex items-center gap-2 text-xs">
            <input id="realtime_counter" type="checkbox" /> リアルタイム件数
        </label>
    </div>

    <!-- Categories -->
    <div class="space-y-1">
        <div class="text-xs font-bold">カテゴリ</div>
        <label class="flex items-center gap-2 text-xs">
            <input name="cat" type="checkbox" value="country" checked /> 国
        </label>
        <label class="flex items-center gap-2 text-xs">
            <input name="cat" type="checkbox" value="capital" checked /> 首都
        </label>
        <label class="flex items-center gap-2 text-xs">
            <input name="cat" type="checkbox" value="custom" /> カスタム
        </label>
    </div>

</div>

<!-- RUN -->
<button id="btn" onclick="run()" class="w-full bg-blue-600 text-white py-3 rounded-full font-black">
    Explore
</button>

<!-- Copy All -->
<button onclick="copyAll()" class="w-full bg-slate-800 text-white py-2 rounded-full text-xs font-bold">
    Copy All
</button>

<!-- Reset -->
<button onclick="resetSettings()" class="w-full bg-rose-600 text-white py-2 rounded-full text-xs font-bold">
    Reset
</button>

<!-- Results -->
<div id="res" class="space-y-3 pb-20"></div>
</div> <!-- max-w-md -->

<script>
function toggleDarkMode() {
    document.documentElement.classList.toggle("dark")
}

function getCategories() {
    return [...document.querySelectorAll("input[name='cat']:checked")].map(x => x.value)
}

function resetSettings() {
    document.getElementById("sw").value = ""
    document.getElementById("sc").value = ""
    document.getElementById("must_char").value = ""
    document.getElementById("ec").value = ""
    document.getElementById("ew").value = ""
    document.getElementById("asc").value = ""
    document.getElementById("aec").value = ""
    document.getElementById("valid_chars").value = ""
    document.getElementById("exclude_chars").value = ""
    document.getElementById("ban_start_chars").value = ""
    document.getElementById("ttl").value = ""
    document.getElementById("len_mode").value = "free"
    document.getElementById("sort_mode").value = "kana"
    document.getElementById("use_shift").checked = false
    document.getElementById("ks_abs").value = 1
    document.getElementById("shift_mode").value = "abs"
    document.getElementById("pos_shift").value = 0
    document.getElementById("unify_small").checked = false
    document.getElementById("allow_daku").checked = false
    document.getElementById("allow_handaku").checked = false
    document.getElementById("auto_recovery").checked = false
    document.getElementById("round_trip").checked = false
    document.getElementById("char_limit_mode").checked = false
    document.getElementById("exclude_conjugate").checked = false
    document.getElementById("anti_loop").checked = false
    document.getElementById("timeout_enabled").checked = true
    document.getElementById("timeout").value = 15
    document.getElementById("limit_enabled").checked = true
    document.getElementById("limit").value = 1500
    document.getElementById("early_cut").checked = false
    document.getElementById("realtime_counter").checked = false
}

async function run() {
    const btn = document.getElementById("btn")
    btn.disabled = true
    btn.innerText = "Searching..."

    const payload = {
        start_word: sw.value,
        start_char: sc.value,
        must_char: must_char.value,
        end_char: ec.value,
        end_word: ew.value,
        all_start_char: asc.value,
        all_end_char: aec.value,
        valid_chars: valid_chars.value,
        exclude_chars: exclude_chars.value,
        ban_start_chars: ban_start_chars.value,
        target_total_len: ttl.value ? Number(ttl.value) : null,
        len_mode: len_mode.value,
        sort_mode: sort_mode.value,
        use_shift: use_shift.checked,
        ks_abs: Number(ks_abs.value),
        shift_mode: shift_mode.value,
        pos_shift: Number(pos_shift.value),
        unify_small: unify_small.checked,
        allow_daku: allow_daku.checked,
        allow_handaku: allow_handaku.checked,
        auto_recovery: auto_recovery.checked,
        round_trip: round_trip.checked,
        char_limit_mode: char_limit_mode.checked,
        exclude_conjugate: exclude_conjugate.checked,
        anti_loop: anti_loop.checked,
        timeout_enabled: timeout_enabled.checked,
        timeout: Number(timeout.value),
        limit_enabled: limit_enabled.checked,
        limit: Number(limit.value),
        display_mode: early_cut.checked ? "early" : "normal",
        realtime_counter: realtime_counter.checked,
        categories: getCategories(),
        red_words: [],
        blue_words: []
    }

    const resDiv = document.getElementById("res")
    resDiv.innerHTML = ""

    const stats = document.getElementById("stats")
    stats.classList.remove("hidden")
    stats.innerText = "Searching..."

    try {
        const r = await fetch("/search", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload)
        })
        const data = await r.json()

        stats.innerText = `Found: ${data.count}`

        let html = ""
        for (const route of data.routes) {
            html += `<div class="p-3 bg-white dark:bg-slate-800 rounded-xl shadow text-xs">${route.join(" → ")}</div>`
        }
        resDiv.innerHTML = html

    } catch (e) {
        resDiv.innerHTML = `<div class="text-red-500 text-xs">Error: ${e}</div>`
    }

    btn.disabled = false
    btn.innerText = "Explore"
}

function copyAll() {
    const text = [...document.querySelectorAll("#res div")]
        .map(x => x.innerText)
        .join("\n")
    navigator.clipboard.writeText(text)
}
</script>

</body>
</html>
